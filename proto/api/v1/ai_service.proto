syntax = "proto3";

package memos.api.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";

option go_package = "gen/api/v1";

service AIService {
  // Transcribe transcribes an audio file using an instance AI provider.
  rpc Transcribe(TranscribeRequest) returns (TranscribeResponse) {
    option (google.api.http) = {
      post: "/api/v1/ai:transcribe"
      body: "*"
    };
    option (google.api.method_signature) = "audio";
  }

  // Synthesize converts text to speech audio using an instance AI provider.
  rpc Synthesize(SynthesizeRequest) returns (SynthesizeResponse) {
    option (google.api.http) = {
      post: "/api/v1/ai:synthesize"
      body: "*"
    };
    option (google.api.method_signature) = "text";
  }

  // Complete runs one writing-assistant turn against an OpenAI-compatible
  // chat-completions endpoint configured on the instance.
  rpc Complete(CompleteRequest) returns (CompleteResponse) {
    option (google.api.http) = {
      post: "/api/v1/ai:complete"
      body: "*"
    };
    option (google.api.method_signature) = "prompt";
  }
}

message TranscribeRequest {
  // Required. Audio input.
  TranscriptionAudio audio = 1 [(google.api.field_behavior) = REQUIRED];
}

message TranscriptionAudio {
  oneof source {
    // Inline audio bytes.
    bytes content = 1 [(google.api.field_behavior) = INPUT_ONLY];

    // URI for audio content. Reserved for future use.
    string uri = 2;
  }

  // Optional. The uploaded filename.
  string filename = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The MIME type of the input audio.
  string content_type = 4 [(google.api.field_behavior) = OPTIONAL];
}

message TranscribeResponse {
  // The transcribed text.
  string text = 1;
}

message SynthesizeRequest {
  // Required. Text to convert to speech.
  string text = 1 [(google.api.field_behavior) = REQUIRED];
}

message SynthesizeResponse {
  // Generated audio bytes.
  bytes audio = 1;

  // MIME type of the generated audio, e.g. "audio/mpeg".
  string content_type = 2;
}

message CompleteRequest {
  // Required. The user instruction for this turn (e.g. "polish this paragraph").
  string prompt = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. Source text to transform — usually the editor selection, or the
  // whole draft when no selection exists.
  string content = 2 [(google.api.field_behavior) = OPTIONAL];
}

message CompleteResponse {
  // The model's reply text. Writing-assistant responses are plain markdown.
  string text = 1;
}
