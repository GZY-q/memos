# 本 fork 推荐：从当前源码构建镜像（含导航/TTS/审计等）
# 用法:
#   cd web && pnpm install && pnpm release && cd ..   # 必须先编前端
#   cd deploy
#   docker compose -f docker-compose.build.yml up -d --build
# 注意: 整个仓库需在服务器上（git clone 或 rsync）；不要用官方镜像 neosmemo/memos。

services:
  memos:
    build:
      context: ..
      dockerfile: scripts/Dockerfile
      args:
        VERSION: "${MEMOS_VERSION:-dev}"
        COMMIT: "${MEMOS_COMMIT:-unknown}"
    image: memos:${MEMOS_VERSION:-dev}
    container_name: memos
    restart: unless-stopped
    ports:
      - "${MEMOS_HOST_PORT:-5230}:5230"
    volumes:
      - ./data:/var/opt/memos
    environment:
      MEMOS_PORT: "5230"
      MEMOS_INSTANCE_URL: "${MEMOS_INSTANCE_URL:-}"
      TZ: "${TZ:-Asia/Shanghai}"
