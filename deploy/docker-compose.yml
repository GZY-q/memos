# ⚠️ 上游官方镜像 compose —— 不适合本 fork！
# 官方镜像没有导航/日记/TTS/审计/FTS/导入等本仓库功能。
# 部署本仓库请用：docker-compose.build.yml（见 AI_DEPLOY.md / DEPLOY.md）
#
# 仅在你明确只要上游功能时才用本文件：
#   docker compose up -d

services:
  memos:
    image: neosmemo/memos:stable
    container_name: memos
    restart: unless-stopped
    ports:
      - "${MEMOS_HOST_PORT:-5230}:5230"
    volumes:
      - ./data:/var/opt/memos
    environment:
      MEMOS_PORT: "5230"
      # 对外完整地址（https 域名）。不设置时实例处于私有模式。
      MEMOS_INSTANCE_URL: "${MEMOS_INSTANCE_URL:-}"
      TZ: "${TZ:-Asia/Shanghai}"
    # 可选：限制容器资源
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M
